resources:
  jobs:
    custom_lineage_reconciler:
      name: 'vc-observability-custom-lineage-reconciler'
      description: >-
        Reconcilia External Metadata e External Lineage do Unity Catalog a
        partir das tags das tabelas. Roda em dry-run por padrao; use o
        parametro mode=apply para efetivar as mudancas planejadas.
      max_concurrent_runs: 1

      # Tags de custo do provisionamento de observabilidade (Blueshift).
      # Definidas aqui uma unica vez e reaproveitadas pelo alias *cost_tags.
      # AMBIENTE vem da variavel `ambiente` (DEV no target dev, PRD no prd).
      tags: &cost_tags
        ACN: 'NAO'
        AMBIENTE: '${var.ambiente}'
        ANOCRIACAO: '2026'
        APLICACAO: 'DATALAKE_CORP_OBSERVABILIDADE'
        CC: '4KA661'
        COMPARTILHADO: 'NAO'
        DIRETORIA: 'FINANCEIRA_GLOBAL'
        EMPRESA: 'VCBR'
        INICIATIVA: 'DADOS'
        LINHA: 'DATA LAKE - CORP - OBSERVABILIDADE'
        UN: 'DIGITAL'

      parameters:
        - name: mode
          default: dry-run  # apply para gravar
        - name: catalog
          default: ${var.lineage_catalog}
        - name: schema
          default: ${var.lineage_schema}
        - name: default_source_schema
          default: ${var.lineage_default_source_schema}

      job_clusters:
        - job_cluster_key: lineage_reconciler_cluster
          new_cluster:
            spark_version: '17.3.x-scala2.13'
            node_type_id: 'Standard_D4ds_v5'
            num_workers: 1
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            custom_tags: *cost_tags

      tasks:
        - task_key: reconcile_custom_lineage
          job_cluster_key: lineage_reconciler_cluster
          python_wheel_task:
            package_name: vc_observability
            entry_point: reconcile_custom_lineage
            parameters:
              - --mode
              - '{{job.parameters.mode}}'
              - --catalog
              - '{{job.parameters.catalog}}'
              - --schema
              - '{{job.parameters.schema}}'
              - --default-source-schema
              - '{{job.parameters.default_source_schema}}'
          libraries:
            - whl: ../dist/*.whl

    # Job separado do reconciliador, com cluster single node proprio.
    asset_observability:
      name: 'vc-observability-asset-observability'
      description: >-
        Coleta freshness e volume dos ativos monitorados via DESCRIBE DETAIL,
        compara com a expectativa das tags e grava observacoes e eventos em
        Delta. Varre os catalogos dev_ ou prd_ conforme o target. Sem agenda:
        disparado sob demanda (ADF, em producao).
      max_concurrent_runs: 1
      tags: *cost_tags

      job_clusters:
        - job_cluster_key: asset_observability_cluster
          new_cluster:
            spark_version: '17.3.x-scala2.13'
            node_type_id: 'Standard_D4ds_v5'
            num_workers: 0
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: 'local[*, 4]'
            custom_tags:
              <<: *cost_tags
              ResourceClass: SingleNode

      tasks:
        - task_key: collect_asset_observability
          job_cluster_key: asset_observability_cluster
          spark_python_task:
            python_file: ../src/vc_observability/asset_observability/asset_observability.py
            parameters:
              - --environment
              - '${bundle.target}'
              - --monitored-assets-path
              - '${workspace.file_path}/config/shared/assets/monitored-assets.yaml'
          libraries:
            - pypi:
                package: PyYAML>=6.0
